<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro — Privacy Policy</title>
<link rel="icon" type="image/png" href="favicon.png">
<script>
(function () {
  var have = ["pt", "en", "es", "fr", "de", "it", "ja", "ru", "zh", "ar"], pick = null;
  try { pick = localStorage.getItem('lang'); } catch (e) {}
  if (have.indexOf(pick) < 0) {
    var prefs = navigator.languages || [navigator.language || 'en'];
    for (var i = 0; i < prefs.length && !pick; i++) {
      var c = String(prefs[i]).toLowerCase().split('-')[0];
      if (have.indexOf(c) >= 0) pick = c;
    }
  }
  location.replace((pick && have.indexOf(pick) >= 0 ? pick : 'en') + '/' + location.hash);
})();
</script>
